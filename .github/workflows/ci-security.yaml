name: GitHub Actions Security Analysis

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "renovate/**"
    paths:
      - ".github/workflows/**"

permissions: {}

jobs:
  zizmor:
    uses: luxass/shared-workflows/.github/workflows/reusable-ci-security.yaml@0feb9a18eeece52ee1ecd344942e0a54d04f4ac2 # v0.17.0
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    with:
      zizmor-version: v1.25.0
