name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

jobs:
  ci:
    uses: luxass/shared-workflows/.github/workflows/reusable-ci.yaml@0feb9a18eeece52ee1ecd344942e0a54d04f4ac2 # v0.17.0
    permissions:
      contents: read
    with:
      fmt: true
      fmt-script: "fmt:check"
